<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>実践パート一覧 | CSS設計とチームのためのCSS</title>
    <style>
      :root {
        --primary: #6f4e37;
        --accent: #c8a27a;
        --text: #3e2f25;
        --bg: #faf6f2;
        --surface: #ffffff;
        --border: #e8ddd3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        color: var(--text);
        background-color: var(--bg);
        line-height: 1.7;
      }
      main {
        max-width: 760px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.5rem;
        color: var(--primary);
        margin-bottom: 8px;
      }
      p.lead {
        color: #6b5d52;
        margin-top: 0;
        margin-bottom: 40px;
      }
      section.practice {
        margin-bottom: 32px;
        padding: 24px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      section.practice h2 {
        margin-top: 0;
        font-size: 1.125rem;
        color: var(--primary);
      }
      section.practice .meta {
        display: inline-block;
        margin-bottom: 12px;
        padding: 2px 10px;
        font-size: 0.8rem;
        color: #ffffff;
        background-color: var(--accent);
        border-radius: 999px;
      }
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .links a {
        display: inline-block;
        padding: 8px 20px;
        font-size: 0.9rem;
        color: var(--primary);
        text-decoration: none;
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .links a:hover {
        background-color: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
      }
      .links a.readme {
        color: #ffffff;
        background-color: var(--primary);
        border-color: var(--primary);
      }
      section.practice.no-html {
        opacity: 0.75;
      }
      section.practice.no-html .links a {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>実践パート一覧</h1>
      <p class="lead">「CSS設計とチームのためのCSS」講座の実践3つ。各カードから start / goal を開けます。</p>

      <section class="practice">
        <span class="meta">実践① 15分</span>
        <h2>ファイル分割と Cascade Layers</h2>
        <div class="links">
          <a class="readme" href="01-file-split/01-README.md">README</a>
          <a href="01-file-split/start/index.html">start</a>
          <a href="01-file-split/goal/index.html">goal</a>
        </div>
      </section>

      <section class="practice">
        <span class="meta">実践② 15分</span>
        <h2>CSSバリアブル（デザイントークン）</h2>
        <div class="links">
          <a class="readme" href="02-css-variables/02-README.md">README</a>
          <a href="02-css-variables/start/index.html">start</a>
          <a href="02-css-variables/goal/index.html">goal</a>
          <a href="02-css-variables/figma-variables.md">Figmaバリアブル一覧</a>
        </div>
      </section>

      <section class="practice no-html">
        <span class="meta">実践③ 25分</span>
        <h2>コーディング規約づくり</h2>
        <div class="links">
          <a class="readme" href="03-coding-guidelines/03-README.md">README</a>
          <a href="03-coding-guidelines/drafts/draft-a.md">たたき台A</a>
          <a href="03-coding-guidelines/drafts/draft-b.md">たたき台B</a>
          <a href="03-coding-guidelines/worksheet.md">ワークシート</a>
          <a href="03-coding-guidelines/template.md">テンプレート</a>
        </div>
      </section>
    </main>
  </body>
</html>
